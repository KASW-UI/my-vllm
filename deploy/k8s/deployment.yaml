apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-vllm-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-vllm
  template:
    metadata:
      labels:
        app: my-vllm
    spec:
      nodeSelector:
        accelerator: nvidia-a100
      containers:
      - name: my-vllm
        image: my-vllm:latest
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
        - name: MODEL_NAME
          value: "opt-125m"
        - name: TP_SIZE
          value: "2"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
